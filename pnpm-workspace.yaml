packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@babylonjs/core": ^9.28.0
  "@commitlint/cli": ^21.2.3
  "@commitlint/config-conventional": ^21.2.3
  "@playwright/test": ^1.63.0
  "@reduxjs/toolkit": ^2.13.0
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  react: ^19.3.0
  react-dom: ^19.3.0
  react-redux: ^9.3.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
