name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: check, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "22"
          cache: true
      - run: vp install
      - run: vp check
      - run: vp run -r test
      - run: vp run -r build
